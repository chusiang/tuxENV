# --------------------------------------------------------------------
#   Alacritty terminal configuration for v0.17.0 on macOS.
# --------------------------------------------------------------------

# general.working_directory = "~"

# - Color (base16-tomorrow-night-eighties.vim) -----------------------

[colors.primary]
background = "#262626"
foreground = "#C6C2BB"

[colors.normal]
black = "#373b41"
blue = "#6699cc"
cyan = "#66cccc"
green = "#99cc99"
magenta = "#cc99cc"
red = "#f2777a"
white = "#ffffff"
yellow = "#ffcc66"

# - Font -------------------------------------------------------------

# SauceCodePro Nerd Font: Fork from "Source Code Pro" font.
#
# > https://github.com/ryanoasis/nerd-fonts/releases/download/v3.2.1/SourceCodePro.zip

[font]
size = 18.0

[font.normal]
family = "SauceCodePro Nerd Font"
style = "Regular"

[font.bold]
family = "SauceCodePro Nerd Font"
style = "Medium"

[font.italic]
family = "SauceCodePro Nerd Font"
style = "Italic"

[font.bold_italic]
family = "SauceCodePro Nerd Font"
style = "Bold Italic"

# - Shell -----------------------------------------------------------

[terminal.shell]
program = "/usr/local/bin/bash"
args = ["-l", "-c", "tmux attach || tmux"]

# - Mouse -----------------------------------------------------------

[mouse]
hide_when_typing = true

# - Window ----------------------------------------------------------

[window]
opacity = 0.95

# - Keybinding ------------------------------------------------------

[keyboard]
bindings = [
  # For macOS.
  { key = "j", mods = "Command", chars = "\x01\x6e" },
  { key = "k", mods = "Command", chars = "\x01\x70" },
]

# vim: ft=toml
